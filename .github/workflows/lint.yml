name: Lint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l client server)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 检查，请运行 gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        working-directory: client
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Run go test
        working-directory: client
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1

      - name: Run golangci-lint
        # 建议级：结论照常贴在 PR 上，但不阻断合并；基础质量由上面的 gofmt/vet/test 保证
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: "0"
        with:
          version: latest
          working-directory: client
          only-new-issues: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    # CI 里没有 wails 命令，前端靠提交在仓库里的 wailsjs 绑定直接构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        # npm run build 里带 vue-tsc --noEmit，类型检查不过这里就挂
        run: npm run build
