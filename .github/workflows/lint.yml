name: Lint

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l client server)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 检查，请运行 gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        working-directory: client
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Run go test
        working-directory: client
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/... -count=1

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        env:
          CGO_ENABLED: "0"
        with:
          version: latest
          working-directory: client
          only-new-issues: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
